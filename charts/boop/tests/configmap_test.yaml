---
suite: configmap
templates:
  - templates/configmap.yaml
tests:
  - it: renders nothing by default (no data)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ConfigMap when data is set
    set:
      configMap.data:
        APP_MODE: standard
        CACHE_TTL: "30s"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boop
      - equal:
          path: data.APP_MODE
          value: standard
      - equal:
          path: data.CACHE_TTL
          value: 30s

  - it: renders nothing when an existing ConfigMap is referenced
    set:
      configMap.data:
        APP_MODE: standard
      configMap.existingConfigMap: my-config
    asserts:
      - hasDocuments:
          count: 0
