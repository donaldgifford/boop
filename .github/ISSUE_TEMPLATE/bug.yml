---
name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Service (Go code)
        - Helm chart
        - Docker / image build
        - CI / release
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Commands, values overrides, or manifests that trigger it
      placeholder: |
        1. helm install ... -f values.yaml
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version
      description: Image tag / chart version / commit where you hit this
    validations:
      required: false
