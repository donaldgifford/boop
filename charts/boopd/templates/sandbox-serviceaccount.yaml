{{- if and .Values.sandbox.enabled .Values.sandbox.serviceAccount.create -}}
# The sandboxed Jobs' ServiceAccount (DESIGN-0005 § Pod posture): in the
# runs namespace, no API token mounted and no bindings, so code in the VM
# has no Kubernetes identity to use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandbox.serviceAccount.name }}
  namespace: {{ .Values.boopd.runs.namespace | default .Release.Namespace }}
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
automountServiceAccountToken: false
{{- end }}
