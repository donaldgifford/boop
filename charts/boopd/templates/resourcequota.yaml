{{- $pods := int .Values.boopd.runs.maxConcurrent -}}
{{- if gt $pods 0 -}}
{{- $ns := .Values.boopd.runs.namespace | default .Release.Namespace -}}
{{- if eq $ns .Release.Namespace -}}
{{- $pods = add $pods .Values.replicaCount -}}
{{- if .Values.redis.enabled -}}
{{- $pods = add $pods 1 -}}
{{- end -}}
{{- if .Values.ingest.enabled -}}
{{- $pods = add $pods .Values.ingest.replicaCount -}}
{{- end -}}
{{- end -}}
# A cluster-side backstop for runs.max_concurrent (IMPL-0001 OQ12). The
# worker enforces the cap with a CapacityWorkflow lease; this quota only
# matters if that is bypassed. It limits pods, not Jobs, so a Job past it
# is created and its pod refused, and the run waits pending_timeout.
# It covers every pod in the namespace: the worker and ingest replicas
# and the redis pod are added when they share it, and any other pod there takes a slot,
# so a dedicated runs namespace is the clean setup. Rendered whenever
# boopd.runs.maxConcurrent > 0 (IMPL-0002 OQ7).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "boopd.fullname" . }}-runs
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ $pods | quote }}
    {{- with .Values.resourceQuota.hard }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
