{{- if .Values.networkPolicies.enabled -}}
{{- $ns := .Values.boopd.runs.namespace | default .Release.Namespace -}}
{{- range $class, $np := .Values.networkPolicies.egress }}
---
# Job pods labelled boopd.dev/egress={{ $class }} (a profile's pod.labels)
# take no ingress and reach only DNS, the redis subchart and the listed
# egress. Sandboxed pods are left out even when they inherit the label:
# policies add up, and the sandbox's own policy must be all they get.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.fullname" $ }}-egress-{{ $class }}
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      boopd.dev/egress: {{ $class | quote }}
    matchExpressions:
      - {key: boopd.dev/sandbox, operator: DoesNotExist}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if $.Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ $.Release.Name }}
          {{- if ne $ns $.Release.Namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          {{- end }}
      ports:
        - {port: 6379, protocol: TCP}
    {{- end }}
    {{- with $np }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.ingest.enabled }}
{{- $np := .Values.ingest.networkPolicy }}
---
# The ingest pods (DESIGN-0003 § Chart): the webhook port from the
# ingress controller or gateway, metrics from Prometheus; egress to DNS
# and Temporal only, never GitHub.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.ingest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boopd.ingest.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if or $np.from $np.metricsFrom }}
  ingress:
    {{- with $np.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: http, protocol: TCP}
    {{- end }}
    {{- with $np.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: metrics, protocol: TCP}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- with $np.temporal }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.store.enabled }}
    {{- with .Values.store.networkPolicy.rw }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.api.enabled }}
{{- $np := .Values.api.networkPolicy }}
---
# The API pods (DESIGN-0004): the listen port from the UI pods and
# api.networkPolicy.from, metrics from Prometheus; egress to DNS,
# Postgres's read-only service, Temporal and the IdP's JWKS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.role.fullname" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boopd.role.selectorLabels" (list . "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "boopd.role.selectorLabels" (list . "ui") | nindent 14 }}
        {{- with $np.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {port: http, protocol: TCP}
    {{- with $np.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: metrics, protocol: TCP}
    {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- with .Values.store.networkPolicy.ro }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $np.temporal }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $np.idp }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.ui.enabled }}
{{- $np := .Values.ui.networkPolicy }}
---
# The UI pods (DESIGN-0004 § The UI): the BFF port from the ingress
# controller or gateway; egress to DNS, the API pods and the IdP only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.role.fullname" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "ui") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boopd.role.selectorLabels" (list . "ui") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with $np.from }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: http, protocol: TCP}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              {{- include "boopd.role.selectorLabels" (list . "api") | nindent 14 }}
      ports:
        - {port: {{ .Values.config.port }}, protocol: TCP}
    {{- with $np.idp }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.store.enabled }}
---
# The migrate hook's pod: no ingress; egress to DNS and Postgres's
# read-write service only. The worker has no policy of its own, so its
# path to Postgres needs none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.role.fullname" (list . "migrate") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "migrate") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boopd.role.selectorLabels" (list . "migrate") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- with .Values.store.networkPolicy.rw }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
