{{- if and .Values.configMap.data (not .Values.configMap.existingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "boop.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boop.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
