{{- if .Values.rbac.create -}}
{{- $ns := .Values.boopd.runs.namespace | default .Release.Namespace -}}
# The worker's only Kubernetes rights (DESIGN-0001 § Credentials and the
# Job pod): create, unsuspend (patch) and follow one Job per run, read
# its pod and log, and own the run's token Secret. Secrets have no list:
# the worker only touches the Secret it created, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "boopd.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
  {{- if .Values.sandbox.enabled }}
  # Why a sandboxed pod is stuck pending: FailedScheduling or
  # FailedCreatePodSandBox (IMPL-0006 OQ9).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "boopd.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "boopd.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "boopd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.sandbox.enabled .Values.sandbox.checkRuntimeClass }}
---
# The sandbox check (IMPL-0006 OQ2): the worker looks the sandbox's
# RuntimeClass up before each sandboxed run and every minute. Cluster
# scoped, so a ClusterRole, limited to that one RuntimeClass.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "boopd.fullname" . }}-{{ .Release.Namespace }}-runtimeclass
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    resourceNames: [{{ .Values.sandbox.runtimeClass | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "boopd.fullname" . }}-{{ .Release.Namespace }}-runtimeclass
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "boopd.fullname" . }}-{{ .Release.Namespace }}-runtimeclass
subjects:
  - kind: ServiceAccount
    name: {{ include "boopd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
