{{/*
Starter alert pack (design Q3a): two generic alerts built only on
kube-state-metrics / cAdvisor series, so they work for any service
without app-specific metric names. Per-alert overrides live under
prometheusRule.alerts.<name> and accept `enabled`, `for`, `severity`,
and `threshold`. `hasKey` guards (not `default`) so explicit falsy
overrides like enabled=false or threshold=0 are honored.
*/}}
{{- if .Values.prometheusRule.enabled -}}
{{- $alerts := .Values.prometheusRule.alerts | default dict }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "boopd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "boopd.fullname" . }}.rules
      rules:
        {{- $ru := $alerts.replicasUnavailable | default dict }}
        {{- $ruEnabled := true }}{{- if hasKey $ru "enabled" }}{{- $ruEnabled = $ru.enabled }}{{- end }}
        {{- $ruThreshold := 0 }}{{- if hasKey $ru "threshold" }}{{- $ruThreshold = $ru.threshold }}{{- end }}
        {{- if $ruEnabled }}
        - alert: DeploymentReplicasUnavailable
          expr: >-
            kube_deployment_status_replicas_unavailable{namespace="{{ .Release.Namespace }}",deployment="{{ include "boopd.fullname" . }}"}
            > {{ $ruThreshold }}
          for: {{ $ru.for | default "10m" }}
          labels:
            severity: {{ $ru.severity | default "warning" }}
          annotations:
            summary: {{ include "boopd.name" . }} has unavailable replicas
            description: >-
              Deployment {{ include "boopd.fullname" . }} in namespace
              {{ .Release.Namespace }} has had more than {{ $ruThreshold }}
              unavailable replica(s) for {{ $ru.for | default "10m" }}.
        {{- end }}
        {{- $cr := $alerts.containerRestarting | default dict }}
        {{- $crEnabled := true }}{{- if hasKey $cr "enabled" }}{{- $crEnabled = $cr.enabled }}{{- end }}
        {{- $crThreshold := 3 }}{{- if hasKey $cr "threshold" }}{{- $crThreshold = $cr.threshold }}{{- end }}
        {{- if $crEnabled }}
        - alert: ContainerRestarting
          expr: >-
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="{{ .Chart.Name }}"}[15m])
            > {{ $crThreshold }}
          for: {{ $cr.for | default "0m" }}
          labels:
            severity: {{ $cr.severity | default "warning" }}
          annotations:
            summary: {{ include "boopd.name" . }} container is restarting
            description: >-
              Container {{ .Chart.Name }} in namespace {{ .Release.Namespace }}
              restarted more than {{ $crThreshold }} times in the last 15
              minutes.
        {{- end }}
{{- end }}
