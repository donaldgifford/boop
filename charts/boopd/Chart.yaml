---
# yaml-language-server: $schema=https://json.schemastore.org/chart.json
apiVersion: v2
name: boopd
description: boopd runs Renovate per repository with Temporal as the control plane
type: application
# version/appVersion are placeholders, never bumped by hand — releases
# are lockstep with the app: the release train packages the chart with
# `helm package --version <tag> --app-version <tag>` so binary, image,
# and chart all carry the same semver from the PR-label bump. This is
# the chart-side equivalent of the binary printing 0.0.0-dev until CI
# stamps VERSION at release time.
version: 0.0.0-dev
appVersion: "0.0.0-dev"
dependencies:
  # Local subchart (charts/redis): Renovate's datasource cache.
  - name: redis
    version: 0.0.0-dev
    condition: redis.enabled
