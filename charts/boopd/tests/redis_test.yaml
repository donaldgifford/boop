---
suite: redis
templates:
  - charts/redis/templates/secret.yaml
  - charts/redis/templates/deployment.yaml
  - templates/config.yaml
  - templates/deployment.yaml
tests:
  - it: turns the default user off and limits renovate to its prefix
    template: charts/redis/templates/secret.yaml
    asserts:
      - matchRegex:
          path: stringData["users.acl"]
          pattern: '(?m)^user default off$'
      - matchRegex:
          path: stringData["users.acl"]
          pattern: 'user renovate on #[0-9a-f]{64} resetkeys ~renovate:\* resetchannels -@all .* -@dangerous'
      - matchRegex:
          path: stringData.url
          pattern: '^redis://renovate:[A-Za-z0-9]{40}@RELEASE-NAME-redis\.NAMESPACE\.svc:6379$'

  - it: runs as an LRU cache at the memory cap with the ACL file
    template: charts/redis/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: [--maxmemory, 256mb, --maxmemory-policy, allkeys-lru, --aclfile, /etc/redis/users.acl, --save, "", --appendonly, "no", --dir, /data]

  - it: points the config at the subchart's Secret and sets redisPrefix
    template: templates/config.yaml
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'redis_secret_ref \{\s+name = "RELEASE-NAME-redis-auth"\s+key  = "url"'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'redisPrefix = "renovate:"'

  - it: mounts the subchart's URL Secret in the worker
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secret-4a59dc73d6
            mountPath: /etc/boopd/secrets/RELEASE-NAME-redis-auth
            readOnly: true

  - it: uses an external Redis through its Secret when the subchart is off
    template: templates/config.yaml
    set:
      redis.enabled: false
      boopd.renovate.redisSecretRef: {name: shared-redis, key: url}
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'name = "shared-redis"'
      - notMatchRegex:
          path: data["boopd.hcl"]
          pattern: redisPrefix

  - it: names no Redis at all when neither is set
    template: templates/config.yaml
    set:
      redis.enabled: false
    asserts:
      - notMatchRegex:
          path: data["boopd.hcl"]
          pattern: redis_secret_ref

  - it: renders no password Secret with redis.auth.existingSecret
    template: charts/redis/templates/secret.yaml
    set:
      redis.auth.existingSecret: boopd-redis-password
    asserts:
      - hasDocuments:
          count: 0

  - it: rolls redis on a new chart-owned password
    template: charts/redis/templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/auth"]

  - it: hashes the existing Secret's password into an in-memory ACL file
    template: charts/redis/templates/deployment.yaml
    set:
      redis.auth.existingSecret: boopd-redis-password
      redis.auth.existingSecretKey: pw
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/auth"]
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: acl
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: boopd-redis-password
                key: pw
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: ACL_RULES
            value: "resetkeys ~renovate:* resetchannels -@all +@read +@write +@connection -@dangerous +client|setinfo"
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: acl
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi

  - it: builds the URL from redis_url and the existing Secret
    template: templates/config.yaml
    set:
      redis.auth.existingSecret: boopd-redis-password
    asserts:
      - notMatchRegex:
          path: data["boopd.hcl"]
          pattern: 'redis_secret_ref'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'redis_url = "redis://renovate@RELEASE-NAME-redis\.NAMESPACE\.svc:6379"'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'redis_password_secret_ref \{\s+name = "boopd-redis-password"\s+key  = "password"'

  - it: mounts the existing password Secret in the worker
    template: templates/deployment.yaml
    set:
      redis.auth.existingSecret: boopd-redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secret-947f86fdea
            mountPath: /etc/boopd/secrets/boopd-redis-password
            readOnly: true

  - it: lets an explicit redisSecretRef win over existingSecret
    template: templates/config.yaml
    set:
      redis.auth.existingSecret: boopd-redis-password
      boopd.renovate.redisSecretRef: {name: my-redis, key: url}
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'redis_secret_ref \{\s+name = "my-redis"'
      - notMatchRegex:
          path: data["boopd.hcl"]
          pattern: 'redis_url'

  - it: rejects existingSecret without the subchart
    template: templates/deployment.yaml
    set:
      redis.enabled: false
      redis.auth.existingSecret: boopd-redis-password
    asserts:
      - failedTemplate:
          errorPattern: "redis.auth.existingSecret needs redis.enabled"

  - it: rejects existingSecret without a key
    template: templates/deployment.yaml
    set:
      redis.auth.existingSecret: boopd-redis-password
      redis.auth.existingSecretKey: null
    asserts:
      - failedTemplate:
          errorPattern: "redis.auth.existingSecretKey must name the key"
