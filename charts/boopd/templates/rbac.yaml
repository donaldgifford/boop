{{- if .Values.rbac.create -}}
{{- $ns := .Values.boopd.runs.namespace | default .Release.Namespace -}}
# The worker's only Kubernetes rights (DESIGN-0001 § Credentials and the
# Job pod): create, unsuspend (patch) and follow one Job per run, read
# its pod and log, and own the run's token Secret. Secrets have no list:
# the worker only touches the Secret it created, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "boopd.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "boopd.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "boopd.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "boopd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
