---
suite: namespace posture
templates:
  - templates/namespace.yaml
  - templates/resourcequota.yaml
  - templates/networkpolicy.yaml
tests:
  - it: renders no namespace or policies by default
    templates:
      - templates/namespace.yaml
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the quota by default, from maxConcurrent 20
    template: templates/resourcequota.yaml
    asserts:
      - isKind:
          of: ResourceQuota

  - it: labels the runs namespace restricted
    template: templates/namespace.yaml
    set:
      namespace.create: true
      boopd.runs.namespace: boopd
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: boopd
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: restricted
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/warn"]
          value: restricted

  - it: sizes the quota from maxConcurrent plus the worker and redis pods
    template: templates/resourcequota.yaml
    asserts:
      - equal:
          path: spec.hard.pods
          value: "23"

  - it: adds the ingest replicas to the quota when they share the namespace
    template: templates/resourcequota.yaml
    set:
      ingest.enabled: true
    asserts:
      - equal:
          path: spec.hard.pods
          value: "25"

  - it: leaves ingest out of a dedicated runs namespace's quota
    template: templates/resourcequota.yaml
    set:
      ingest.enabled: true
      boopd.runs.namespace: boopd-runs
    asserts:
      - equal:
          path: spec.hard.pods
          value: "20"

  - it: leaves redis out of the quota when the subchart is off
    template: templates/resourcequota.yaml
    set:
      redis.enabled: false
      boopd.renovate.redisSecretRef: {name: my-redis, key: url}
    asserts:
      - equal:
          path: spec.hard.pods
          value: "22"

  - it: counts only Job pods when runs live in their own namespace
    template: templates/resourcequota.yaml
    set:
      boopd.runs.namespace: boopd-runs
    asserts:
      - equal:
          path: spec.hard.pods
          value: "20"
      - equal:
          path: metadata.namespace
          value: boopd-runs

  - it: renders no quota without a cap
    template: templates/resourcequota.yaml
    set:
      boopd.runs.maxConcurrent: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: selects Job pods by their egress class
    template: templates/networkpolicy.yaml
    set:
      networkPolicies.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.podSelector.matchLabels["boopd.dev/egress"]
          value: baseline
        documentIndex: 0
      - equal:
          path: spec.ingress
          value: []
        documentIndex: 0
      - contains:
          path: spec.egress
          content:
            ports:
              - {port: 443, protocol: TCP}
        documentIndex: 1
