---
suite: service
templates:
  - templates/service.yaml
tests:
  - it: renders a ClusterIP Service by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boopd
      - equal:
          path: spec.type
          value: ClusterIP

  - it: exposes http and metrics ports targeting the named container ports
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[1].port
          value: 9090
      - equal:
          path: spec.ports[1].targetPort
          value: metrics

  - it: honors service.type override
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: selects pods via the selector labels
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: boopd
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
