{{- if .Values.networkPolicies.enabled -}}
{{- $ns := .Values.boopd.runs.namespace | default .Release.Namespace -}}
{{- range $class, $np := .Values.networkPolicies.egress }}
---
# Job pods labelled boopd.dev/egress={{ $class }} (a profile's pod.labels)
# take no ingress and reach only DNS, the redis subchart and the listed
# egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.fullname" $ }}-egress-{{ $class }}
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      boopd.dev/egress: {{ $class | quote }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if $.Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ $.Release.Name }}
          {{- if ne $ns $.Release.Namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          {{- end }}
      ports:
        - {port: 6379, protocol: TCP}
    {{- end }}
    {{- with $np }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
