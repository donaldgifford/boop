{{- if .Values.api.enabled -}}
{{- $tv := dict "Values" (include "boopd.api.temporalValues" . | fromJson) "Chart" .Chart -}}
# The API role (DESIGN-0004 § The API): the read-only DSN, Temporal for a
# recheck, no App key, no ServiceAccount token, no Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "boopd.role.fullname" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "api") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boopd.role.fullname" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "boopd.role.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "boopd.configFile" . | sha256sum }}
        checksum/authz: {{ toYaml .Values.api.authz | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "boopd.role.labels" (list . "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "boopd.role.fullname" (list . "api") }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (include "boopd.appVersion" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - api
            - --config
            - /etc/boopd/boopd.hcl
          ports:
            - containerPort: {{ .Values.config.port }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.config.metricsPort }}
              name: metrics
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.config.port }}"
            - name: METRICS_ADDR
              value: ":{{ .Values.config.metricsPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "boopd.temporalEnv" $tv | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/boopd/boopd.hcl
              subPath: boopd.hcl
              readOnly: true
            - name: authz
              mountPath: /etc/boopd/authz.yaml
              subPath: authz.yaml
              readOnly: true
            {{- include "boopd.storeDSNMount" (list . .Values.store.keys.ro) | nindent 12 }}
            {{- include "boopd.temporalMounts" $tv | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "boopd.fullname" . }}-config
        - name: authz
          configMap:
            name: {{ include "boopd.role.fullname" (list . "api-authz") }}
        {{- include "boopd.storeDSNVolume" (list . .Values.store.keys.ro) | nindent 8 }}
        {{- include "boopd.temporalVolumes" $tv | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "boopd.role.fullname" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "boopd.role.selectorLabels" (list . "api") | nindent 4 }}
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "boopd.role.fullname" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "api") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.api.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "boopd.role.selectorLabels" (list . "api") | nindent 6 }}
{{- end }}
{{- end }}
