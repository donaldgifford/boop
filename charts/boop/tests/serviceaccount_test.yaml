---
suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: creates a ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boop

  - it: renders nothing when creation is disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: honors a name override
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: applies annotations
    set:
      serviceAccount.annotations:
        example.com/role: reader
    asserts:
      - equal:
          path: metadata.annotations["example.com/role"]
          value: reader
