{{- if .Values.ui.enabled -}}
{{- $u := .Values.ui -}}
# The management UI (DESIGN-0004 § The UI): the BFF holds the session and
# proxies /api to the API Service. No Kubernetes access, no ServiceAccount
# token; its secrets arrive as env from ui.existingSecret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "boopd.role.fullname" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "ui") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boopd.role.fullname" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "ui") | nindent 4 }}
spec:
  replicas: {{ $u.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "boopd.role.selectorLabels" (list . "ui") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "boopd.role.labels" (list . "ui") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "boopd.role.fullname" (list . "ui") }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ $u.image.repository }}:{{ $u.image.tag | default (include "boopd.appVersion" .) }}"
          imagePullPolicy: {{ $u.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              value: {{ $u.publicURL | quote }}
            - name: API_UPSTREAM
              value: {{ printf "http://%s.%s.svc:%v" (include "boopd.role.fullname" (list . "api")) .Release.Namespace .Values.api.service.port | quote }}
            - name: OIDC_ISSUER
              value: {{ $u.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $u.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $u.existingSecret }}
                  key: client-secret
            - name: UI_SESSION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $u.existingSecret }}
                  key: session-keys
            {{- with $u.oidc.scopes }}
            - name: OIDC_SCOPES
              value: {{ join " " . | quote }}
            {{- end }}
            {{- with $u.oidc.tokenAuthMethod }}
            - name: OIDC_TOKEN_AUTH_METHOD
              value: {{ . | quote }}
            {{- end }}
            {{- with $u.oidc.authorizationParams }}
            - name: OIDC_AUTHORIZATION_PARAMS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with $u.sessionTTL }}
            - name: UI_SESSION_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with $u.links }}
            - name: UI_LINKS
              value: {{ toJson . | quote }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $u.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "boopd.role.fullname" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "ui") | nindent 4 }}
spec:
  type: {{ $u.service.type }}
  ports:
    - port: {{ $u.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "boopd.role.selectorLabels" (list . "ui") | nindent 4 }}
{{- if $u.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "boopd.role.fullname" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.role.labels" (list . "ui") | nindent 4 }}
spec:
  maxUnavailable: {{ $u.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "boopd.role.selectorLabels" (list . "ui") | nindent 6 }}
{{- end }}
{{- end }}
