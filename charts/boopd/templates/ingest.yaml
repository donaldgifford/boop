{{- include "boopd.ingest.validate" . -}}
{{- if .Values.ingest.enabled -}}
{{- $tv := dict "Values" (include "boopd.ingest.temporalValues" . | fromJson) "Chart" .Chart -}}
# The webhook ingest role (DESIGN-0003 § The ingest role): no App key, no
# ServiceAccount token, no Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "boopd.ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.ingest.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boopd.ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.ingest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "boopd.ingest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "boopd.configFile" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "boopd.ingest.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "boopd.ingest.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.ingest.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (include "boopd.appVersion" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - ingest
            - --config
            - /etc/boopd/boopd.hcl
          ports:
            - containerPort: {{ .Values.config.port }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.config.metricsPort }}
              name: metrics
              protocol: TCP
          {{- $hasConfigMap := or .Values.configMap.data .Values.configMap.existingConfigMap }}
          {{- $hasSecret := or (and .Values.secrets.create .Values.secrets.stringData) .Values.secrets.existingSecret }}
          {{- if or $hasConfigMap $hasSecret }}
          envFrom:
            {{- if $hasConfigMap }}
            - configMapRef:
                name: {{ include "boopd.configMapName" . }}
            {{- end }}
            {{- if $hasSecret }}
            - secretRef:
                name: {{ include "boopd.secretName" . }}
            {{- end }}
          {{- end }}
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.config.port }}"
            - name: METRICS_ADDR
              value: ":{{ .Values.config.metricsPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "boopd.temporalEnv" $tv | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/boopd/boopd.hcl
              subPath: boopd.hcl
              readOnly: true
            {{- include "boopd.ingest.credentialMounts" . | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "boopd.fullname" . }}-config
        {{- include "boopd.ingest.credentialVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "boopd.ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.ingest.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ingest.service.type }}
  ports:
    - port: {{ .Values.ingest.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "boopd.ingest.selectorLabels" . | nindent 4 }}
{{- if .Values.ingest.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "boopd.ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.ingest.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.ingest.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "boopd.ingest.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
