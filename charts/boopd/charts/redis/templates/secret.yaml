{{- $password := include "redis.password" . -}}
# The ACL file and the URL boopd hands Renovate. The default user is off;
# the renovate user reaches only keys under the prefix and no dangerous
# commands (FLUSHALL, CONFIG, KEYS, DEBUG, ...).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  url: {{ printf "redis://renovate:%s@%s.%s.svc:6379" $password (include "redis.fullname" .) .Release.Namespace | quote }}
  users.acl: |
    user default off
    user renovate on #{{ sha256sum $password }} resetkeys ~{{ .Values.keyPrefix }}* resetchannels -@all +@read +@write +@connection -@dangerous +client|setinfo
