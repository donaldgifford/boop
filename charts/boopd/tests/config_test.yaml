---
suite: config file
templates:
  - templates/config.yaml
tests:
  - it: renders boopd.hcl into the config ConfigMap
    values:
      - ../ci/ci-values.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boopd-config
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'app "boop-bot" \{'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'namespace = "NAMESPACE"'

  - it: keeps an explicit false in a free block
    set:
      boopd.renovate.global:
        platformAutomerge: false
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'platformAutomerge = false'

  - it: escapes template sequences in strings
    set:
      boopd.renovate.gitAuthor: "bot ${x} %{y}"
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'git_author = "bot \$\$\{x\} %%\{y\}"'

  - it: leaves config_paths to boopd's default when empty
    asserts:
      - notMatchRegex:
          path: data["boopd.hcl"]
          pattern: 'config_paths'

  - it: renders config_paths as a list
    set:
      boopd.renovate.configPaths: [renovate.json5, .github/renovate.json5]
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'config_paths = \["renovate.json5",".github/renovate.json5"\]'

  - it: rejects an image not pinned by digest
    set:
      boopd.renovate.image: ghcr.io/renovatebot/renovate:44-full
    asserts:
      - failedTemplate: {}

  - it: gives the Python profile a RuntimeClass when set
    set:
      boopd.profiles.python.pod.runtimeClassName: gvisor
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'runtime_class_name = "gvisor"'

  - it: renders the golden example (examples/boopd.hcl as values)
    values:
      - values/example.yaml
    asserts:
      - matchSnapshot:
          path: data["boopd.hcl"]

  - it: renders runs.hostUsers, true by default
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'host_users = true'

  - it: renders hostUsers false
    set:
      boopd.runs.hostUsers: false
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'host_users = false'

  - it: renders no sandbox block without the sandbox
    asserts:
      - notMatchRegex:
          path: data["boopd.hcl"]
          pattern: 'sandbox \{'

  - it: renders the sandbox block and the sandboxed profile's keys
    values:
      - values/sandbox-enforce.yaml
    asserts:
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'sandbox \{\n  runtime_class   = "kata-qemu"\n  service_account = "boopd-sandbox"'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'floor_mode = "enforce"\n  floor_add = \["gomod"\]\n  pending_timeout = "12m"\n  check_runtime_class = true'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'toleration \{\n    key = "boopd.dev/sandbox"\n    operator = "Equal"\n    value = "true"\n    effect = "NoSchedule"\n  \}'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'profile "jvm" \{\n  inherit = "baseline"\n  sandboxed = true\n  unsafe_executions = \["gradleWrapper"\]'
      - matchRegex:
          path: data["boopd.hcl"]
          pattern: 'token_permissions = \{"checks":"write","contents":"write","issues":"write","metadata":"read","pull_requests":"write","statuses":"write"\}'
