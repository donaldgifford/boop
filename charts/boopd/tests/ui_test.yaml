---
suite: ui
templates:
  - templates/ui.yaml
  - templates/routes.yaml
  - templates/networkpolicy.yaml
  - templates/migrate-job.yaml
tests:
  - it: renders nothing for the UI by default
    templates:
      - templates/ui.yaml
      - templates/routes.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ServiceAccount, Deployment, Service and PDB
    values: [values/store-api-ui.yaml]
    template: templates/ui.yaml
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Deployment
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/donaldgifford/boopd-ui:0.0.0-dev
        documentIndex: 1

  - it: gives the UI no ServiceAccount token and no volumes
    values: [values/store-api-ui.yaml]
    template: templates/ui.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        documentIndex: 1
      - notExists:
          path: spec.template.spec.volumes
        documentIndex: 1

  - it: configures the BFF, with its secrets from the existing Secret
    values: [values/store-api-ui.yaml]
    template: templates/ui.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: API_UPSTREAM, value: "http://RELEASE-NAME-boopd-api.NAMESPACE.svc:8080"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PUBLIC_URL, value: "https://boop.example.com"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: boopd-ui, key: client-secret}}}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: UI_SESSION_KEYS, valueFrom: {secretKeyRef: {name: boopd-ui, key: session-keys}}}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_AUTHORIZATION_PARAMS, value: '{"audience":"boopd-api"}'}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: UI_LINKS, value: '[{"label":"Grafana","url":"https://grafana.example.com"}]'}

  - it: routes everything to the BFF
    values: [values/store-api-ui.yaml]
    template: templates/routes.yaml
    set:
      ui.httpRoute: {enabled: true, parentRefs: [{name: gw}], hostnames: [boop.example.com]}
    asserts:
      - equal:
          path: spec.rules[0]
          value:
            matches: [{path: {type: PathPrefix, value: /}}]
            backendRefs: [{name: RELEASE-NAME-boopd-ui, port: 80}]

  - it: reaches only DNS, the API pods and the IdP under the policies
    values: [values/store-api-ui.yaml]
    template: templates/networkpolicy.yaml
    set:
      networkPolicies.enabled: true
    documentIndex: 4
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boopd-ui
      - equal:
          path: spec.ingress
          value: []
      - contains:
          path: spec.egress
          content:
            to: [{podSelector: {matchLabels: {app.kubernetes.io/name: boopd-api, app.kubernetes.io/instance: RELEASE-NAME}}}]
            ports: [{port: 8080, protocol: TCP}]

  - it: fails without the API
    template: templates/migrate-job.yaml
    set:
      ui.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "ui.enabled needs api.enabled"

  - it: fails without sign-in
    values: [values/store-api-ui.yaml]
    template: templates/migrate-job.yaml
    set:
      ui.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "need the UI with sign-in|ui.enabled needs ui.oidc.issuer"

  - it: fails a UI route without auth
    template: templates/migrate-job.yaml
    set:
      ui.httpRoute: {enabled: true, parentRefs: [{name: gw}]}
    asserts:
      - failedTemplate:
          errorPattern: "ui.ingress and ui.httpRoute need the UI with sign-in"

  - it: rejects an http public URL
    values: [values/store-api-ui.yaml]
    template: templates/ui.yaml
    set:
      ui.publicURL: http://boop.example.com
    asserts:
      - failedTemplate:
          errorPattern: "publicURL"
