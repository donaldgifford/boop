---
suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: renders a Deployment with default values
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boopd
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.revisionHistoryLimit
          value: 3

  - it: runs the worker role with a grace period above StartToClose
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: [worker, --config, /etc/boopd/boopd.hcl]
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 3600

  - it: rejects a grace period at or below StartToClose
    set:
      terminationGracePeriodSeconds: 3480
    asserts:
      - failedTemplate: {}

  - it: derives the image from repository + appVersion by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/donaldgifford/boopd:0.0.0-dev

  - it: honors image.tag override
    set:
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/donaldgifford/boopd:v1.2.3

  - it: exposes http and metrics container ports from config
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9090
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: metrics

  - it: sets the chart-managed env convention
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_ADDR
            value: ":9090"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: info

  - it: has no envFrom by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: wires envFrom configMapRef when configMap.data is set
    set:
      configMap.data:
        APP_MODE: standard
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-boopd

  - it: prefers an existing ConfigMap for envFrom
    set:
      configMap.existingConfigMap: my-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: my-config

  - it: wires envFrom secretRef when secrets.stringData is set
    set:
      secrets.stringData:
        API_TOKEN: hunter2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-boopd

  - it: uses an existing Secret for envFrom when create is false
    set:
      secrets.create: false
      secrets.existingSecret: operator-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: operator-secret

  - it: appends extraEnv after the chart-managed env
    set:
      extraEnv:
        - name: FEATURE_FLAG
          value: "on"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_FLAG
            value: "on"
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: LISTEN_ADDR

  - it: applies the container security context defaults
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: uses the release-scoped ServiceAccount
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-boopd

  - it: honors command override
    set:
      command:
        - /bin/server
        - --debug
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/server

  - it: mounts the config file read-only and rolls pods when it changes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/boopd/boopd.hcl
            subPath: boopd.hcl
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-boopd-config
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: sets the Temporal env and the build ID from the image tag
    set:
      temporal.address: temporal:7233
      image.tag: v0.1.0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_ADDRESS, value: "temporal:7233"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_NAMESPACE, value: boopd}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_BUILD_ID, value: v0.1.0}

  - it: mounts each config Secret at secretsDir/<name> with only its key
    values:
      - ../ci/ci-values.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secret-2dcd826ef4
            mountPath: /etc/boopd/secrets/boop-bot-app
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-2dcd826ef4
            secret:
              secretName: boop-bot-app
              defaultMode: 0440
              items:
                - {key: private-key.pem, path: private-key.pem}

  - it: mounts the Temporal mTLS Secret and points the env at it
    set:
      temporal.tls.existingSecret: boopd-temporal-tls
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: temporal-tls, mountPath: /etc/boopd/temporal-tls, readOnly: true}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_TLS_CERT_PATH, value: /etc/boopd/temporal-tls/tls.crt}

  - it: mounts the OIDC client secret as a file
    set:
      temporal.auth.oidc:
        tokenUrl: https://idp/token
        clientId: boopd
        existingSecret: boopd-oidc
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_OIDC_CLIENT_SECRET_PATH, value: /etc/boopd/temporal-oidc/client-secret}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: temporal-oidc
            secret:
              secretName: boopd-oidc
              defaultMode: 0440
              items:
                - {key: client-secret, path: client-secret}

  - it: fails OIDC without a client secret
    set:
      temporal.auth.oidc.tokenUrl: https://idp/token
    asserts:
      - failedTemplate:
          errorPattern: needs clientId and existingSecret

  - it: rejects extraEnv shadowing a Temporal variable
    set:
      extraEnv:
        - {name: TEMPORAL_ADDRESS, value: x}
    asserts:
      - failedTemplate:
          errorPattern: extraEnv\[TEMPORAL_ADDRESS\]
