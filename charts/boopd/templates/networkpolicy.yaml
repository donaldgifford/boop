{{- if .Values.networkPolicies.enabled -}}
{{- $ns := .Values.boopd.runs.namespace | default .Release.Namespace -}}
{{- range $class, $np := .Values.networkPolicies.egress }}
---
# Job pods labelled boopd.dev/egress={{ $class }} (a profile's pod.labels)
# take no ingress and reach only DNS, the redis subchart and the listed
# egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.fullname" $ }}-egress-{{ $class }}
  namespace: {{ $ns }}
  labels:
    {{- include "boopd.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      boopd.dev/egress: {{ $class | quote }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if $.Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ $.Release.Name }}
          {{- if ne $ns $.Release.Namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          {{- end }}
      ports:
        - {port: 6379, protocol: TCP}
    {{- end }}
    {{- with $np }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.ingest.enabled }}
{{- $np := .Values.ingest.networkPolicy }}
---
# The ingest pods (DESIGN-0003 § Chart): the webhook port from the
# ingress controller or gateway, metrics from Prometheus; egress to DNS
# and Temporal only, never GitHub.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boopd.ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boopd.ingest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boopd.ingest.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if or $np.from $np.metricsFrom }}
  ingress:
    {{- with $np.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: http, protocol: TCP}
    {{- end }}
    {{- with $np.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: metrics, protocol: TCP}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- with $np.temporal }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
