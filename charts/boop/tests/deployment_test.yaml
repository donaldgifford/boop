---
suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: renders a Deployment with default values
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boop
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.revisionHistoryLimit
          value: 3

  - it: derives the image from repository + appVersion by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/donaldgifford/boopd:0.0.0-dev

  - it: honors image.tag override
    set:
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/donaldgifford/boopd:v1.2.3

  - it: exposes http and metrics container ports from config
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9090
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: metrics

  - it: sets the chart-managed env convention
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_ADDR
            value: ":9090"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: info

  - it: has no envFrom by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: wires envFrom configMapRef when configMap.data is set
    set:
      configMap.data:
        APP_MODE: standard
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-boop

  - it: prefers an existing ConfigMap for envFrom
    set:
      configMap.existingConfigMap: my-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: my-config

  - it: wires envFrom secretRef when secrets.stringData is set
    set:
      secrets.stringData:
        API_TOKEN: hunter2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-boop

  - it: uses an existing Secret for envFrom when create is false
    set:
      secrets.create: false
      secrets.existingSecret: operator-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: operator-secret

  - it: appends extraEnv after the chart-managed env
    set:
      extraEnv:
        - name: FEATURE_FLAG
          value: "on"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_FLAG
            value: "on"
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: LISTEN_ADDR

  - it: applies the container security context defaults
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: uses the release-scoped ServiceAccount
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-boop

  - it: honors command override
    set:
      command:
        - /bin/server
        - --debug
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/server
