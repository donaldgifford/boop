---
suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders nothing by default (no stringData)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an Opaque Secret when stringData is set
    set:
      secrets.stringData:
        API_TOKEN: hunter2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boop
      - equal:
          path: stringData.API_TOKEN
          value: hunter2

  - it: renders nothing when creation is disabled
    set:
      secrets.create: false
      secrets.stringData:
        API_TOKEN: hunter2
    asserts:
      - hasDocuments:
          count: 0
