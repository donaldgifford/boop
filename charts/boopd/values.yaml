---
# -- Worker replicas. A fixed, small count (ADR-0008 as amended by
# ADR-0009): runs are Jobs, so the worker never scales with load.
replicaCount: 2

# -- Seconds Kubernetes waits after SIGTERM. Must exceed the RunRenovate
# StartToClose (58m) so a draining worker lets in-flight runs reach their
# soft deadlines (DESIGN-0001 § Worker shutdown).
terminationGracePeriodSeconds: 3600

# -- Number of old ReplicaSets retained for rollback. Defaults to 3 to
# keep the kubectl `get rs` view tidy; bump if you need more rollback
# headroom. Kubernetes default is 10.
revisionHistoryLimit: 3

image:
  # -- Container image repository
  repository: ghcr.io/donaldgifford/boopd
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Override the container command (default: image entrypoint)
command: []
# -- Container args. The default runs the worker role against the
# chart-rendered config file.
args:
  - worker
  - --config
  - /etc/boopd/boopd.hcl

config:
  # -- Container HTTP port (published to the container as LISTEN_ADDR)
  port: 8080
  # -- Container metrics port (published as METRICS_ADDR)
  metricsPort: 9090
  # -- Log level (published as LOG_LEVEL)
  logLevel: info

# -- boopd.hcl, rendered into the `<fullname>-config` ConfigMap and
# mounted read-only at /etc/boopd/boopd.hcl. The keys mirror the config
# file's blocks in camelCase (examples/boopd.hcl is the annotated
# reference); an empty or absent key leaves the file's default.
# @default -- See values.yaml
boopd:
  # Where the chart mounts the Secrets the config names: <dir>/<name>/<key>.
  secretsDir: /etc/boopd/secrets
  renovate:
    # Must be pinned by digest; Renovate keeps the tag and digest current.
    image: ghcr.io/renovatebot/renovate:44-full@sha256:fc07a2877ce78abcaba5ac19e5bebb47b228785b6a74bf9834ff6119112bf260
    configPath: renovate.json
    sharedPreset: ""
    logLevel: info
    dryRun: ""
    gitAuthor: ""
    # Merged into RENOVATE_CONFIG; an explicit false is preserved.
    global: {}
    # The Secret holding the Redis URL (the Redis section below).
    redisSecretRef: {}
  runs:
    # Where Jobs are created; empty means the release namespace.
    namespace: ""
    pendingTimeout: 10m
    # Cluster-capacity cap across installations; 0 means no cap.
    maxConcurrent: 20
  # Profiles by name. `pod` and `renovate` follow the config file's
  # profile blocks.
  profiles:
    baseline:
      pod:
        labels:
          boopd.dev/egress: baseline
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {cpu: "2", memory: 4Gi}
    node:
      inherit: baseline
    python:
      inherit: baseline
      pod:
        # Set to the cluster's sandboxing RuntimeClass, if it has one.
        runtimeClassName: ""
        labels:
          boopd.dev/egress: python
        resources:
          limits: {memory: 6Gi}
      renovate:
        customEnvVariables:
          PIP_ONLY_BINARY: ":all:"
          UV_NO_BUILD: "1"
    strict:
      inherit: python
  # Ascending strictness.
  order: [baseline, node, python, strict]
  defaultProfile: baseline
  unknownProfile: strict
  # Every matching rule contributes; the strictest wins.
  profileRules: []
  # GitHub Apps by name. At least one is required:
  #   boop-bot:
  #     appId: 123456
  #     privateKeySecretRef: {name: boop-bot-app, key: private-key.pem}
  #     discovery: {every: 6h, probe: graphql}
  #     budget: {reserveFraction: 0.10, maxConcurrentRuns: 10}
  apps: {}

configMap:
  # -- Key/value pairs projected into a chart-managed ConfigMap and
  # injected into the container via envFrom. Keys must not collide with
  # the chart-managed env vars (LISTEN_ADDR, METRICS_ADDR, LOG_LEVEL,
  # POD_NAME) — the render fails fast on collisions.
  data: {}
  # -- Use an existing ConfigMap for envFrom instead of rendering one
  existingConfigMap: ""

rbac:
  # -- Create the worker's Role and RoleBinding in the runs namespace:
  # jobs create/get/list/watch/patch/delete, pods get/list/watch, pods/log get,
  # secrets create/get/delete (no list).
  create: true

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context
podSecurityContext: {}

# -- Container security context (65532 = distroless nonroot uid)
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

service:
  # -- Service type
  type: ClusterIP
  # -- HTTP port
  httpPort: 80
  # -- Metrics port
  metricsPort: 9090

# -- Container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

secrets:
  # -- Create the Secret resource (false = use existingSecret)
  create: true
  # -- Key/value pairs projected into the chart-managed Secret
  # (stringData) and injected via envFrom. Same collision guard as
  # configMap.data.
  stringData: {}
  # -- Name of an existing Secret for envFrom (when create=false)
  existingSecret: ""

serviceMonitor:
  # -- Create Prometheus ServiceMonitor
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for ServiceMonitor
  labels: {}

prometheusRule:
  # -- Create PrometheusRule with the generic starter alerts
  # (DeploymentReplicasUnavailable, ContainerRestarting).
  enabled: false
  # -- Additional labels (e.g., to match Prometheus operator
  # `ruleSelector`).
  labels: {}
  # -- Per-alert overrides: keys `replicasUnavailable` and
  # `containerRestarting`, each accepting `enabled`, `for`,
  # `severity`, and `threshold`.
  alerts: {}

# -- Additional environment variables (must not collide with the
# chart-managed env vars — render fails fast)
extraEnv: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts
extraVolumeMounts: []

# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
