---
suite: prometheusrule
templates:
  - templates/prometheusrule.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the two starter alerts when enabled
    set:
      prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.name
          value: RELEASE-NAME-boopd
      - equal:
          path: spec.groups[0].rules[0].alert
          value: DeploymentReplicasUnavailable
      - equal:
          path: spec.groups[0].rules[1].alert
          value: ContainerRestarting

  - it: scopes the replicas alert to this release's deployment
    set:
      prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: deployment="RELEASE-NAME-boopd"

  - it: defaults severities to warning
    set:
      prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: warning
      - equal:
          path: spec.groups[0].rules[1].labels.severity
          value: warning

  - it: honors per-alert severity and for overrides
    set:
      prometheusRule.enabled: true
      prometheusRule.alerts.replicasUnavailable:
        severity: critical
        for: 5m
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: critical
      - equal:
          path: spec.groups[0].rules[0].for
          value: 5m

  - it: honors threshold override in the expression
    set:
      prometheusRule.enabled: true
      prometheusRule.alerts.containerRestarting:
        threshold: 0
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: "> 0$"

  - it: disables an individual alert
    set:
      prometheusRule.enabled: true
      prometheusRule.alerts.containerRestarting:
        enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 1
      - equal:
          path: spec.groups[0].rules[0].alert
          value: DeploymentReplicasUnavailable

  - it: merges additional labels
    set:
      prometheusRule.enabled: true
      prometheusRule.labels:
        role: alert-rules
    asserts:
      - equal:
          path: metadata.labels.role
          value: alert-rules
