---
name: Feature Request
description: Propose a new feature or improvement
title: "[Feature] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Service (Go code)
        - Helm chart
        - Docker / image build
        - CI / release
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the problem you are trying to solve, not just the
        solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
